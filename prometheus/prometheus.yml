global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:18081']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']